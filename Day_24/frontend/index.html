<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 24 - IMDB Sentiment Analysis</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #333333;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            margin-top: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-card {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        .positive {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .negative {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>IMDB Review Sentiment Analysis</h2>
    <p>Enter a movie review to analyze whether the sentiment is positive or negative.</p>
    
    <textarea id="reviewInput" placeholder="Type or paste a movie review here..."></textarea>
    <button onclick="analyzeSentiment()">Analyze Sentiment</button>

    <div id="resultCard" class="result-card">
        <h3 id="sentimentResult"></h3>
        <p id="probabilityResult"></p>
    </div>
</div>

<script>
async function analyzeSentiment() {
    const review = document.getElementById("reviewInput").value;
    const resultCard = document.getElementById("resultCard");
    const sentimentResult = document.getElementById("sentimentResult");
    const probabilityResult = document.getElementById("probabilityResult");

    if (!review.trim()) {
        alert("Please enter a review first.");
        return;
    }

    try {
        const response = await fetch("http://127.0.0.1:5000/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ review: review })
        });

        const data = await response.json();

        if (response.ok) {
            resultCard.style.display = "block";
            resultCard.className = "result-card " + data.sentiment;
            sentimentResult.innerText = `Sentiment: ${data.sentiment.toUpperCase()}`;
            probabilityResult.innerText = `Confidence: Positive: ${(data.probabilities.positive * 100).toFixed(2)}% | Negative: ${(data.probabilities.negative * 100).toFixed(2)}%`;
        } else {
            alert(data.error || "An error occurred.");
        }
    } catch (err) {
        alert("Unable to connect to the backend server. Make sure app.py is running.");
    }
}
</script>

</body>
</html>
