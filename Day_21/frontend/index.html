<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 21: Loan Risk Evaluation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">Loan Approval Analytics</h1>
                <p class="text-slate-400 text-sm">Day 21 ML Pipeline Dashboard</p>
            </div>
            <div id="metrics-bar" class="flex gap-4 text-xs">
                <!-- Metrics populated via JS -->
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Form Input Panel -->
            <form id="loanForm" class="lg:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-lg font-semibold text-slate-200">Applicant Information</h2>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Annual Income ($)</label>
                        <input type="number" id="Income" value="65000" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Credit Score</label>
                        <input type="number" id="CreditScore" value="710" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Employment (Years)</label>
                        <input type="number" id="EmploymentYears" value="5" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Loan Amount ($)</label>
                        <input type="number" id="LoanAmount" value="15000" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Debt to Income Ratio</label>
                        <input type="number" step="0.01" id="DebtToIncome" value="0.25" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Income / Year Employed</label>
                        <input type="number" id="IncomePerYearEmployed" value="13000" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Has Collateral?</label>
                        <select id="HasCollateral" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white">
                            <option value="1">Yes</option>
                            <option value="0">No</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Previous Defaults?</label>
                        <select id="PreviousDefaults" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold text-white py-2.5 rounded-lg transition">
                    Run Model Predictions
                </button>
            </form>

            <!-- Results Panel -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-semibold text-slate-200 mb-4">Model Predictions</h2>
                    <div id="results" class="space-y-4">
                        <p class="text-slate-500 text-sm">Submit applicant data to view evaluation output across trained classifiers.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";

        // Fetch Model Metrics on Load
        async function fetchMetrics() {
            try {
                const res = await fetch(`${API_BASE}/api/metrics`);
                const data = await res.json();
                const container = document.getElementById('metrics-bar');
                container.innerHTML = Object.entries(data).map(([model, metrics]) => `
                    <div class="bg-slate-800 px-3 py-1.5 rounded border border-slate-700">
                        <span class="text-indigo-400 font-semibold">${model}:</span> 
                        <span class="text-slate-300">Acc: ${metrics.accuracy} | F1: ${metrics.f1}</span>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error fetching metrics:", err);
            }
        }

        // Form Submit Handler
        document.getElementById('loanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                Income: parseFloat(document.getElementById('Income').value),
                CreditScore: parseFloat(document.getElementById('CreditScore').value),
                EmploymentYears: parseFloat(document.getElementById('EmploymentYears').value),
                LoanAmount: parseFloat(document.getElementById('LoanAmount').value),
                HasCollateral: parseInt(document.getElementById('HasCollateral').value),
                PreviousDefaults: parseInt(document.getElementById('PreviousDefaults').value),
                DebtToIncome: parseFloat(document.getElementById('DebtToIncome').value),
                IncomePerYearEmployed: parseFloat(document.getElementById('IncomePerYearEmployed').value),
            };

            const res = await fetch(`${API_BASE}/api/predict`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';

            Object.entries(data.predictions).forEach(([name, pred]) => {
                const isApproved = pred.approved;
                resultsContainer.innerHTML += `
                    <div class="p-3 bg-slate-700/50 rounded-lg border border-slate-600 flex justify-between items-center">
                        <div>
                            <p class="text-sm font-semibold text-slate-200">${name}</p>
                            <p class="text-xs text-slate-400">Probability: ${pred.confidence}%</p>
                        </div>
                        <span class="px-2.5 py-1 text-xs rounded font-bold ${isApproved ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500' : 'bg-rose-500/20 text-rose-400 border border-rose-500'}">
                            ${isApproved ? 'APPROVED' : 'DENIED'}
                        </span>
                    </div>
                `;
            });
        });

        fetchMetrics();
    </script>
</body>
</html>
